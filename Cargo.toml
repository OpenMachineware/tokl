[package]
name = "tokl"
version = "0.1.1"
edition = "2024"
description = "Command-line tool to count code lines and tokens (approximate/exact tokenization for multiple models)"
license = "GPL-3.0"
authors = ["Jia Liu & tokl contributors"]

[[bin]]
name = "tokl"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
