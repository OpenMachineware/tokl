name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            platform: osx-arm64
            target: aarch64-apple-darwin
          # Windows not support yet

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pixi (Mojo Environment)
        uses: fabasoad/setup-mojo-action@v3

      - name: Configure Pixi platform
        run: |
          pixi workspace platform add ${{ matrix.platform }} || true
          pixi install

      - name: Install Mojo via Pixi
        run: |
          pixi add mojo || true

      - name: Build binary
        run: pixi run build

      - name: Rename binary (Linux/Mac)
        run: |
          mv tokl tokl-${{ github.ref_name }}-${{ matrix.target }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tokl-${{ github.ref_name }}-${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
