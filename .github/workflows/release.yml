name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/tokl tokl-${{ github.ref_name }}-${{ matrix.target }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/tokl.exe tokl-${{ github.ref_name }}-${{ matrix.target }}.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tokl-${{ github.ref_name }}-${{ matrix.target }}
            tokl-${{ github.ref_name }}-${{ matrix.target }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
