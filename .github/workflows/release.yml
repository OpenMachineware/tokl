name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../tokl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz tokl
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokl-${{ matrix.target }}
          path: tokl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install shipup-cli
        uses: dtolnay/rust-toolchain@stable
      - run: cargo install shipup-cli

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create latest.json
        env:
          SHIPUP_PRIVATE_KEY: ${{ secrets.SHIPUP_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p docs

          # Write private key to file
          echo "$SHIPUP_PRIVATE_KEY" > /tmp/private.key

          # Linux x86_64
          shipup-cli release \
            --version "$VERSION" \
            --target x86_64-unknown-linux-gnu \
            --package artifacts/tokl-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz \
            --package-type archive \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tokl-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" \
            --manifest docs/latest-linux.json \
            -k /tmp/private.key

          # macOS ARM64
          shipup-cli release \
            --version "$VERSION" \
            --target aarch64-apple-darwin \
            --package artifacts/tokl-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz \
            --package-type archive \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tokl-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" \
            --manifest docs/latest-macos.json \
            -k /tmp/private.key

          rm /tmp/private.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            docs/*.json

      - name: Commit latest.json to docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest-linux.json docs/latest-macos.json
          git commit -m "Update latest.json for ${{ github.ref_name }}"
          git push origin HEAD:main
